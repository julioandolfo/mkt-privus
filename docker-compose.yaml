services:
  # ===== APPLICATION (PHP-FPM) =====
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    # 6 workers × memory_limit 512M no php.ini = pior caso 3 GB, mas raramente
    # todos os workers usam o teto ao mesmo tempo. 1 GB cobre o regime
    # estacionário com folga; se passar disso é leak e queremos que reinicie.
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== WEB SERVER =====
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    # nginx só faz proxy reverso pro app:9000 — 256 MB é generoso.
    mem_limit: 256m
    mem_reservation: 64m
    expose:
      - "80"
    volumes:
      - public_build:/var/www/html/public/build
      - app_storage:/var/www/html/storage
    depends_on:
      - app

  # ===== QUEUE WORKER =====
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    # Container alvo do leak: jobs de geração de imagem carregam ~2 MB de
    # base64 por chamada (4 refs). 768 MB acomoda o pico de um job pesado
    # (--memory=384 do queue:work) + overhead PHP/Imagick; se estourar é
    # leak e o Docker mata limpo (incidente 21/06: worker passou disso e
    # derrubou tudo silenciosamente porque não tinha cap).
    mem_limit: 768m
    mem_reservation: 256m
    # Por que cada flag:
    # --max-time=3600 recicla o worker a cada 1h (descarta memória acumulada
    #                 por Imagick/OPcache de forma previsível). É a defesa
    #                 PRINCIPAL anti-leak agora — restart raro (24x/dia).
    # --memory=384    encerra o worker se ultrapassar 384 MB num job
    #                 (proteção contra runaway num job pesado individual).
    # REMOVIDO --max-jobs=50: fazia o worker SAIR a cada 50 jobs, e como o
    #                 Docker reinicia (restart: unless-stopped) cada saída
    #                 vira um "restart". Com filas de email cheias isso gerou
    #                 4000+ restarts e re-executava o entrypoint a cada ciclo.
    #                 O --memory já cobre o anti-leak sem reciclar tão cedo.
    command: php artisan queue:work --queue=email,autopilot,default --sleep=3 --tries=3 --timeout=290 --max-time=3600 --memory=384
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== SCHEDULER (CRON) =====
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    # Roda 'schedule:run' a cada 60s — processo curto, baixo consumo.
    mem_limit: 256m
    mem_reservation: 64m
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - app_storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== DATABASE =====
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # MySQL precisa de buffer pool razoável; 1 GB é o mínimo confortável
    # para um DB com a quantidade de tabelas/índices do projeto.
    mem_limit: 1g
    mem_reservation: 512m
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mkt_privus}
      MYSQL_USER: ${DB_USERNAME:-mkt_privus}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=-03:00

  # ===== CACHE / QUEUE =====
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis já tem maxmemory=256mb no comando; 320m no container deixa
    # 64m de overhead pra fork/AOF/RDB sem o kernel matar o processo.
    mem_limit: 320m
    mem_reservation: 128m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # AUTO-REPARO DE AOF NO BOOT: um AOF corrompido (ex: shutdown sujo por
    # OOM/kill) fazia o redis entrar em crash-loop ao carregar o arquivo
    # incremental — e como app/worker/scheduler dependem de redis healthy,
    # o deploy inteiro caía. O AOF vive no volume, então a corrupção
    # SOBREVIVE a redeploys. Aqui, antes de subir o redis, rodamos
    # redis-check-aof --fix no manifesto multipart (redis 7). Em AOF
    # saudável é no-op; em AOF corrompido trunca a parte ruim e preserva o
    # resto (dados de cache/fila são recriáveis). `yes |` responde à
    # confirmação interativa do --fix.
    command:
      - sh
      - -c
      - |
        DIR=/data/appendonlydir
        MANIFEST="$$DIR/appendonly.aof.manifest"
        if [ -f "$$MANIFEST" ]; then
          echo ">> [redis] Verificando/reparando AOF multipart..."
          yes | redis-check-aof --fix "$$MANIFEST" || echo ">> [redis] check-aof retornou erro; aof-load-truncated cobre o resto"
        fi
        # AOF single-file legado (redis <7), por segurança
        if [ -f /data/appendonly.aof ]; then
          yes | redis-check-aof --fix /data/appendonly.aof || true
        fi
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --aof-load-truncated yes \
          --stop-writes-on-bgsave-error no \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru

volumes:
  app_storage:
    driver: local
  public_build:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
