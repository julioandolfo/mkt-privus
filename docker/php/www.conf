; PHP-FPM pool customizado para MKT Privus
;
; ATENÇÃO: este arquivo só contém diretivas de POOL.
; Diretivas globais (emergency_restart_*, process_control_timeout, error_log
; do daemon) ficam em /usr/local/etc/php-fpm.conf no master config — não
; entram aqui, ou o FPM falha em iniciar com "unknown entry".
;
; Por que cada parâmetro:
;
; - pm = dynamic: número de workers se ajusta entre min/max conforme demanda.
;
; - pm.max_children = 6: teto absoluto de workers. Com memory_limit=512M no
;   php.ini, são 6 × 512M = 3 GB no pior cenário — cabe num container de
;   1 GB confortavelmente (pico de geração simultânea = ~1 GB porque nem
;   todo request usa todo o memory_limit).
;
; - pm.max_requests = 500: CRÍTICO. Recicla o worker a cada 500 requests,
;   descartando memória acumulada por OPcache/objetos/extensões nativas
;   (Imagick é notório por vazar). Sem isso, workers vivem para sempre e
;   o leak nunca é limpo — provável causa do silêncio de 6h antes da
;   queda no incidente de 19/06.
;
; - request_terminate_timeout = 300: mata o worker se um request travar
;   mais de 5 min (ex: API da OpenAI pendurada). Bate com max_execution_time
;   do php.ini.
;
; - slowlog: ajuda a diagnosticar o que cada worker fez antes de morrer
;   no próximo incidente.

[www]
user = www
group = www
listen = 9000
listen.owner = www
listen.group = www

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Mata workers que travarem além de 5 min
request_terminate_timeout = 300

; Slowlog para identificar requests lentos no próximo incidente
slowlog = /var/www/html/storage/logs/fpm-slow.log
request_slowlog_timeout = 30s

; Catch worker stdout/stderr para o log do FPM (não o do PHP)
catch_workers_output = yes
decorate_workers_output = no
