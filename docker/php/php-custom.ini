; Configuracoes customizadas do PHP para MKT Privus
date.timezone = America/Sao_Paulo
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000

; Error Logging - fallback caso Laravel logger falhe
log_errors = On
error_log = /var/www/html/storage/logs/php-errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off

; OPcache — dimensionado para 6 workers (pool config em www.conf).
; memory_consumption baixo de 256 para 128: com 6 workers reciclando a
; cada 500 requests (pm.max_requests), 128 MB de OPcache compartilhado
; é suficiente — o codebase tem ~2-3k arquivos PHP e cada um ocupa
; alguns KB compilado.
; memory_consumption alto reservava 256 MB que ficavam ALOCADOS no host
; mesmo idle, somando ao consumo dos workers e empurrando o container
; pro limite quando MySQL/Redis/etc também cresciam.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
